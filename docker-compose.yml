services:
  promptforge:
    build: .
    container_name: promptforge
    ports:
      - "3011:3000"
    env_file:
      - /home/patrick/.env
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_MODEL=${XAI_MODEL:-grok-4.3}
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped